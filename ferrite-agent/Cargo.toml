[package]
name = "ferrite-agent"
version = "0.1.0"
edition = "2021"
description = "Embedded Linux device agent for ferrite-server: image identity, system metrics, reboots, service health"
license = "MIT"
repository = "https://github.com/mighty840/ferrite-sdk"

[[bin]]
name = "ferrite-agent"
path = "src/main.rs"

[features]
default = ["tls"]
# HTTPS via rustls. Without it the agent only speaks plain HTTP, e.g. to a
# gateway on the local network, and the binary is about 1 MB smaller.
tls = ["ureq/tls"]

[dependencies]
ferrite-sdk = { path = "../ferrite-sdk", default-features = false, features = ["encryption"] }
heapless = { workspace = true }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

[dev-dependencies]
tempfile = "3"
