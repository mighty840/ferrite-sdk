language = "C"
style = "type"
header = """/* ferrite-sdk C bindings — generated by cbindgen, do not edit */
#ifndef FERRITE_SDK_H
#define FERRITE_SDK_H

#include <stdint.h>
#include <stdbool.h>
#include <stddef.h>
"""
trailer = """
#endif /* FERRITE_SDK_H */
"""

[export]
include = [
    "FerriteError",
    "FerriteTransport",
    "FerriteRamRegion",
    "FerriteFaultRecord",
    "FerriteUploadStats",
]

[export.rename]
"FerriteError" = "ferrite_error_t"
"FerriteTransport" = "ferrite_transport_t"
"FerriteRamRegion" = "ferrite_ram_region_t"
"FerriteFaultRecord" = "ferrite_fault_record_t"
"FerriteUploadStats" = "ferrite_upload_stats_t"
"FerriteSendChunkFn" = "ferrite_send_chunk_fn_t"
"FerriteIsAvailableFn" = "ferrite_is_available_fn_t"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
rename_args = "SnakeCase"

[parse]
parse_deps = false
