name: QEMU Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  qemu-tests:
    name: QEMU integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: qemu

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binutils-arm-none-eabi

      - name: Build QEMU test binary
        working-directory: tests/qemu
        run: cargo build --locked --target thumbv7m-none-eabi

      - name: Run QEMU integration tests
        run: >
          qemu-system-arm
          -machine lm3s6965evb
          -nographic
          -semihosting-config enable=on,target=native
          -kernel tests/qemu/target/thumbv7m-none-eabi/debug/ferrite-qemu-tests
        timeout-minutes: 2

      - name: Build the qemu-fault example
        working-directory: examples/qemu-fault
        run: cargo build --locked --release

      - name: Run the qemu-fault example
        run: |
          elf=examples/qemu-fault/target/thumbv7m-none-eabi/release/qemu-fault
          qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic \
            -semihosting-config enable=on,target=native -kernel "$elf" | tee qemu-fault.txt
          grep -q 'boot: the previous run crashed' qemu-fault.txt
          grep -q 'cfsr = 0x00010000' qemu-fault.txt
          pc=$(awk '/pc   =/ {print $3}' qemu-fault.txt)
          arm-none-eabi-addr2line -f -C -e "$elf" "$pc" | tee addr2line.txt
          grep -q 'qemu_fault::handle_message' addr2line.txt
        timeout-minutes: 2

      - name: Run the retained-ram example
        working-directory: examples/retained-ram
        run: |
          q="qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic -semihosting-config enable=on,target=native"
          elf=target/thumbv7m-none-eabi/release/retained-ram
          cargo build --locked --release
          $q -kernel "$elf" | tee plain.txt
          grep -q 'boot 3 (magic before init: 0xabcd1234)' plain.txt
          cargo build --locked --release --features noise
          $q -kernel "$elf" | tee noise.txt
          grep -q 'no fault record' noise.txt
          if grep -q 'fault record: pc' noise.txt; then exit 1; fi
        timeout-minutes: 3
