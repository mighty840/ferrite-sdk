[package]
name = "embassy-stm32h563-example"
version = "0.1.0"
edition = "2021"

[dependencies]
# `http` brings the OTA client + manifest verification (no embassy-time pin).
ferrite-sdk = { path = "../../ferrite-sdk", features = ["cortex-m", "http"] }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
# arch-spin: busy-polling executor (no WFE/WFI sleep).
embassy-executor = { version = "0.9", features = ["arch-spin", "executor-thread"] }
# =0.4.0 is the newest embassy-stm32 whose embassy-net (0.7) still uses
# embedded-io-async 0.6, which the SDK's reqwless-based OTA client needs.
embassy-stm32 = { version = "=0.4.0", features = ["stm32h563zi", "time-driver-any", "exti", "unstable-pac", "time"] }
embassy-time = "0.5"
embassy-net = { version = "=0.7.1", features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-sync = "0.7.2"
embassy-boot-stm32 = "=0.6.0"
embassy-futures = "0.1"
embedded-io-async = "0.6"
embedded-storage = "0.3"
defmt = "0.3"
defmt-rtt = "0.4"
static_cell = "2"
heapless = "0.8"

[[bin]]
name = "embassy-stm32h563-example"
path = "src/main.rs"

[profile.release]
debug = 2
lto = "thin"
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 1
