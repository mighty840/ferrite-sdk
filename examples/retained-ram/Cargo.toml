[package]
name = "retained-ram"
version = "0.1.0"
edition = "2021"

[dependencies]
ferrite-sdk = { path = "../../ferrite-sdk", features = ["cortex-m"] }
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[features]
# Fill the retained block with constructed noise before init(), as a
# stand-in for what SRAM can hold after power-up. QEMU's RAM starts as zeros.
noise = []

[profile.release]
debug = 2
opt-level = "s"
